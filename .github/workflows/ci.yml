name: CI

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        if: github.event_name == 'pull_request' || github.ref_name == 'codex/build-production-ready-rtl-website-for-ashbel-aluminum'
        run: npx playwright install --with-deps chromium

      - name: Visual review
        if: github.event_name == 'pull_request' || github.ref_name == 'codex/build-production-ready-rtl-website-for-ashbel-aluminum'
        run: |
          npm run start -- -p 4173 -H 127.0.0.1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              npm run visual:review
              exit 0
            fi
            sleep 2
          done
          echo "Local server did not become ready"
          exit 1

      - name: Prepare direct visual review assets
        if: (github.event_name == 'pull_request' || github.ref_name == 'codex/build-production-ready-rtl-website-for-ashbel-aluminum') && always()
        run: |
          rm -rf review-artifacts
          mkdir -p review-artifacts/visual-review
          cp -R artifacts/visual-review/. review-artifacts/visual-review/
          cd review-artifacts
          zip -r visual-review.zip visual-review

      - name: Upload visual review artifacts
        if: (github.event_name == 'pull_request' || github.ref_name == 'codex/build-production-ready-rtl-website-for-ashbel-aluminum') && always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: artifacts/visual-review/
          if-no-files-found: error

      - name: Upload visual review contact sheet
        if: (github.event_name == 'pull_request' || github.ref_name == 'codex/build-production-ready-rtl-website-for-ashbel-aluminum') && always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-contact-sheet
          path: artifacts/visual-review/contact-sheet.png
          if-no-files-found: error

      - name: Upload visual review summary
        if: (github.event_name == 'pull_request' || github.ref_name == 'codex/build-production-ready-rtl-website-for-ashbel-aluminum') && always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-summary
          path: artifacts/visual-review/summary.md
          if-no-files-found: error

      - name: Commit direct visual review assets
        if: (github.event_name == 'pull_request' || github.ref_name == 'codex/build-production-ready-rtl-website-for-ashbel-aluminum') && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f review-artifacts/visual-review review-artifacts/visual-review.zip
          if git diff --cached --quiet; then
            echo "No direct visual review asset changes"
          else
            git commit -m "Update direct visual review assets [skip ci]"
            git stash push --include-untracked -m visual-review-publish-temp || true
            git pull --rebase origin codex/build-production-ready-rtl-website-for-ashbel-aluminum
            git push origin HEAD:codex/build-production-ready-rtl-website-for-ashbel-aluminum
          fi
